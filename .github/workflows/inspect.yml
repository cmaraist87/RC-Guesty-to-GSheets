name: Inspect the sheet

# Diagnostics. Nothing here calls Guesty, so no token is spent and the daily quota
# is untouched. Everything is read-only EXCEPT bad_units with `write` ticked, which
# rewrites the Property cell of rows carrying an invented unit number -- that one
# column, on those rows, and nothing else.
#
# Exists because these scripts need the Sheets service-account key, which lives in
# Actions secrets and not on anyone's laptop.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "What to look at"
        required: true
        default: stale_moves
        type: choice
        options:
          - stale_moves       # struck rows whose booking is still live elsewhere
          - bad_units         # rows named with an invented unit (427 Gravier 002)
          - date_rows         # every row the sheet holds for one date
          - connecteam        # PREVIEW the Connecteam jobs for one city (never writes)
          - board             # READ what is already on the Connecteam boards
          - schedulers        # LIST every Connecteam board on the account
          - job_match         # can each property be matched to a Connecteam Job?
          - shift_shape      # WRITES probe shifts to the TEST board to learn the API
          - board_peek       # every card on one board, by id (read-only)
          - why_missing       # why is one reservation not on the sheet?
          - duplicates        # rows sharing a (Property, Date)
          - property_check    # pipeline vs sheet, for one property
          - marks_audit       # does reading the marks see the whole tab?
          - strike_snapshot   # every struck row, diffable
          - strike_probe      # is the line on the whole row, or only part of it?
          - filter_audit     # which rows a filter is hiding, per tab
          - clear_filters    # REMOVES the filters that block the marks (needs write)
          - restore_strikes  # re-strike rows repair_strikes lifted without evidence
          - strike_write_test # WRITES to blank rows below the data, then clears them
          - list_tabs         # every tab, its size and layout
      write:
        description: "bad_units / stale_moves / strike_write_test: actually WRITE"
        required: false
        default: false
        type: boolean
      connecteam_write:
        description: "connecteam: preview | write to TEST board | write to the REAL board"
        required: false
        default: preview
        type: choice
        options:
          - preview
          - WRITE-TO-TEST-BOARD
          # Authorised by Chris on 2026-09-21, for Austin, after the test board
          # was shown to be incapable of validating the new card: a Job belongs
          # to a board and the test board owns none. Spelled out in full so it
          # cannot be picked by accident, and still one city at a time.
          - WRITE-TO-MARKET-BOARD-LIVE
      city:
        description: "connecteam ONLY: which market to preview"
        required: false
        default: Austin
        type: choice
        options:
          - Austin
          - New Orleans
          - Bay St. Louis
          - Savannah
          - Thunderbolt
      month:
        description: "connecteam month (YYYY-MM); strike_probe: tab name e.g. Octubre 2026"
        required: false
        default: ""
        type: string
      property:
        description: "property_check: property name; strike_probe: grid rows e.g. 10,11,47,49"
        required: false
        default: ""
        type: string
      code:
        description: "why_missing ONLY: the confirmation code to trace"
        required: false
        default: ""
        type: string
      from:
        description: "board ONLY: range start (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      to:
        description: "board ONLY: range end (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      date:
        description: "date_rows ONLY: which date to dump (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      scope:
        description: "months to check"
        required: true
        default: current-and-later
        type: choice
        options:
          - current-and-later
          - all

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-sync.txt

      - name: Run
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GUESTY_CLIENT_ID: ${{ secrets.GUESTY_CLIENT_ID }}
          GUESTY_CLIENT_SECRET: ${{ secrets.GUESTY_CLIENT_SECRET }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SYNC_LISTING_CITIES: ${{ vars.SYNC_LISTING_CITIES }}
          CONNECTEAM_API_KEY: ${{ secrets.CONNECTEAM_API_KEY }}
          WORKSHEET_NAME: ${{ vars.WORKSHEET_NAME }}
        run: |
          ARGS=""
          if [ "${{ inputs.scope }}" = "all" ]; then ARGS="--all"; fi
          case "${{ inputs.tool }}" in
            stale_moves)
              if [ "${{ inputs.write }}" = "true" ]; then ARGS="$ARGS --fix"; fi
              python -u stale_moves.py $ARGS ;;
            bad_units)
              if [ "${{ inputs.write }}" = "true" ]; then ARGS="$ARGS --fix"; fi
              python -u bad_units.py $ARGS ;;
            date_rows)   python -u date_rows.py --date "${{ inputs.date }}" ;;
            connecteam)
              MONTH=""
              if [ -n "${{ inputs.month }}" ]; then MONTH="--month ${{ inputs.month }}"; fi
              # A card on a crew's phone cannot be taken back the way a sheet cell
              # can, so writing is never the default and never implicit: preview
              # unless asked otherwise, one city at a time, everything unassigned.
              #
              # Until 2026-09-21 no input here could reach a market board at all.
              # That changed because the test board turned out to be incapable of
              # validating the new card -- a Job belongs to a board and the test
              # board owns none -- so the only genuine test is a real one. Chris
              # authorised it for Austin that day. The option is spelled out in
              # full rather than being a boolean, so it cannot be picked by
              # accident, and the city still has to be named.
              if [ "${{ inputs.connecteam_write }}" = "WRITE-TO-TEST-BOARD" ]; then
                echo "::warning::Writing to the TEST board."
                python -u connecteam_push.py --city "${{ inputs.city }}" $MONTH --test --live
              elif [ "${{ inputs.connecteam_write }}" = "WRITE-TO-MARKET-BOARD-LIVE" ]; then
                # A REAL crew board. There is no delete path in this repo, so a
                # card written here is removed by hand or not at all.
                echo "::warning::Writing to ${{ inputs.city }}'"'"'s REAL board."
                echo "::warning::Cards will appear on a crew board. Unassigned, but real."
                python -u connecteam_push.py --city "${{ inputs.city }}" $MONTH --live
              else
                python -u connecteam_push.py --city "${{ inputs.city }}" $MONTH
              fi ;;
            schedulers)  python -u connecteam_board.py --schedulers ;;
            board_peek)
              # `property` carries the board id; from/to bound the window.
              python -u board_peek.py --board "${{ inputs.property }}" --from "${{ inputs.from }}" --to "${{ inputs.to }}" ;;
            job_match)
              MONTH=""
              if [ -n "${{ inputs.month }}" ]; then MONTH="--month ${{ inputs.month }}"; fi
              python -u job_match.py --city "${{ inputs.city }}" $MONTH ;;
            shift_shape)
              # Test board only -- the script verifies the id against the
              # account and has no path to a market board.
              CONFIRM=""
              if [ "${{ inputs.write }}" = "true" ]; then CONFIRM="--confirm"; fi
              python -u shift_shape_probe.py $CONFIRM ;;
            why_missing) python -u find_reservation.py --code "${{ inputs.code }}" ;;
            property_check) python -u property_check.py --property "${{ inputs.property }}" ;;
            marks_audit) python -u marks_audit.py ;;
            strike_snapshot) python -u strike_snapshot.py ;;
            filter_audit) python -u filter_audit.py --rows "${{ inputs.property }}" ;;
            clear_filters)
              CONFIRM=""
              if [ "${{ inputs.write }}" = "true" ]; then CONFIRM="--confirm"; fi
              python -u clear_filters.py $CONFIRM ;;
            restore_strikes)
              TAB="${{ inputs.month }}"
              if [ -z "$TAB" ]; then TAB="Septiembre 2026"; fi
              CONFIRM=""
              if [ "${{ inputs.write }}" = "true" ]; then CONFIRM="--confirm"; fi
              # `code` carries the comma-separated list. Guesty is asked
              # about each one; only those it calls cancelled are struck.
              python -u restore_strikes.py --tab "$TAB" --codes "${{ inputs.code }}" $CONFIRM ;;
            strike_probe)
              TAB="${{ inputs.month }}"
              if [ -z "$TAB" ]; then TAB="Octubre 2026"; fi
              python -u strike_probe.py --tab "$TAB" --rows "${{ inputs.property }}" ;;
            strike_write_test)
              TAB="${{ inputs.month }}"
              if [ -z "$TAB" ]; then TAB="Octubre 2026"; fi
              # Only ever the scratch band: the script verifies every target
              # row is blank and below the last data row, and clears them again.
              CONFIRM=""
              if [ "${{ inputs.write }}" = "true" ]; then CONFIRM="--confirm"; fi
              # The sequence variant writes VALUES to the same blank band
              # first, the way the sync does, then paints. Both are cleared.
              SEQ=""
              if [ "${{ inputs.connecteam_write }}" = "WRITE-TO-TEST-BOARD" ]; then SEQ="--sequence"; fi
              ROWS=""
              if [ -n "${{ inputs.property }}" ]; then ROWS="--rows ${{ inputs.property }}"; fi
              python -u strike_write_test.py --tab "$TAB" $CONFIRM $SEQ $ROWS ;;
            duplicates)
              ARGS2=""
              if [ "${{ inputs.scope }}" = "all" ]; then ARGS2="--all"; fi
              # `property` doubles as --show here: how many slots to list per tab
              # before truncating. The default of 12 hides conflicts further down.
              if [ -n "${{ inputs.property }}" ]; then ARGS2="$ARGS2 --show ${{ inputs.property }}"; fi
              python -u duplicates.py $ARGS2 ;;
            board)
              # GETs only. connecteam_board.py contains no write path at all.
              CITY=""
              if [ -n "${{ inputs.city }}" ]; then CITY="--city ${{ inputs.city }}"; fi
              python -u connecteam_board.py --from "${{ inputs.from }}" --to "${{ inputs.to }}" --keys --jobs --envelope ;;
            *)           python -u list_tabs.py ;;
          esac
